{% load static %}
<!-- Chap yon panel (Sidebar) -->
<nav class="sidebar shadow" id="sidebarNav">
    <div class="sidebar-brand border-bottom border-secondary p-3 d-flex align-items-center">
        <!-- Rasmda ko'rsatilganidek ramkali mebel ikonchasi -->
<i class="bi bi-door-open fs-1 text-light"></i>
        <div>
            <h5 class="m-0 fw-bold text-light">MebelPro</h5>
            <small style="font-size: 0.7rem; color: #9ba4b5;">Loyihadan — Tayyor mebelgacha</small>
        </div>
        <!-- Menyuni yopish uchun X tugmasi -->
        <button class="btn text-light ms-auto p-0 border-0 d-md-none" id="closeBtn">
            <i class="bi bi-x-lg fs-5"></i>
        </button>
    </div>

    <div class="sidebar-menu flex-grow-1 mt-3 px-3 d-flex flex-column gap-2">
    <a href="{% url 'create_project' %}" class="text-decoration-none text-light p-2 rounded"><i class="bi bi-plus-lg me-2"></i> Yangi loyiha</a>
    <a href="{% url 'my_projects' %}" class="text-decoration-none text-light p-2 rounded"><i class="bi bi-folder me-2"></i> Mening loyihalarim</a>
    <a href="{% url 'manage_colors' %}" class="text-decoration-none text-light p-2 rounded"><i class="bi bi-palette me-2"></i> MDF ranglari</a>
    <a href="{% url 'manage_materials' %}" class="text-decoration-none text-light p-2 rounded"><i class="bi bi-layers me-2"></i> Materiallar</a>        
    
    <!-- Sozlamalar tugmasi (boshqa elementlar bilan bir xil klasslar qo'shildi) -->
    <a class="text-decoration-none text-light p-2 rounded d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#settingsSubmenu" role="button" aria-expanded="false" aria-controls="settingsSubmenu">
        <span><i class="bi bi-gear me-2"></i> Sozlamalar</span>
        <i class="bi bi-chevron-down small"></i>
    </a>

    <!-- Sozlamalar bosilganda pastga tushib chiqadigan qismlar -->
    <div class="collapse ps-3 mt-1" id="settingsSubmenu">
        <!-- 1. Profilni tahrirlash -->
        <a href="#" class="nav-link text-white-50 py-2 px-3 mb-1 rounded-3 small" data-bs-toggle="modal" data-bs-target="#profileModal">
            <i class="bi bi-person-badge me-1"></i> Profilni tahrirlash
        </a>
        <!-- 2. Parolni o'zgartirish -->
        <a href="#" class="nav-link text-white-50 py-2 px-3 mb-1 rounded-3 small" data-bs-toggle="modal" data-bs-target="#passwordModal">
            <i class="bi bi-key me-1"></i> Parolni o'zgartirish
        </a>
        <!-- 3. Tizim parametrlari -->
        <a href="#" class="nav-link text-white-50 py-2 px-3 mb-1 rounded-3 small" data-bs-toggle="modal" data-bs-target="#systemModal">
            <i class="bi bi-sliders me-1"></i> Tizim parametrlari
        </a>
        <!-- 4. Ma'lumotlar bazasi zaxirasi -->
        <a href="#" class="nav-link text-white-50 py-2 px-3 mb-1 rounded-3 small" data-bs-toggle="modal" data-bs-target="#backupModal">
            <i class="bi bi-database-down me-1"></i> Ma'lumotlar zaxirasi
        </a>
    </div>
</div>
    

    <div class="mt-auto p-4 border-top border-secondary">
        <div class="d-flex align-items-center mb-3">
            <i class="bi bi-person-circle fs-1 text-light me-3"></i>
            <div>
                <h6 class="text-white m-0">{{ request.user.username|default:"Mebelchi" }}</h6>
                <small class="text-secondary">admin</small>
            </div>
        </div>
        <form method="post" action="{% url 'logout' %}" id="logout-form" style="display: none;">
            {% csrf_token %}
        </form>
        <a href="#" id="logoutBtn" class="text-decoration-none text-light opacity-75" onclick="document.getElementById('logout-form').submit(); return false;">
            <i class="bi bi-box-arrow-right me-2"></i> Chiqish
        </a>
    </div>
</nav>
