{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm border-0 text-center">
        <h4>Loyihani o'chirishni tasdiqlaysizmi?</h4>
        <p class="text-muted">"{{ project.title }}" loyihasi butunlay o'chiriladi.</p>
        
        
<form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4 me-2">Ha, o'chirish</button>
            <a href="{% url 'my_projects' %}" class="btn btn-secondary px-4">Bekor qilish</a>
        </form>
    </div>
</div>
{% endblock %}
