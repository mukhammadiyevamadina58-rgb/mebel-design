<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MebelDesign - Tizimga kirish</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #f4f6f9;
        }
        .auth-card {
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card auth-card border-0 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="bi bi-box-seam me-2"></i>MebelDesign</h2>
            <p class="text-muted small mb-0">Tizimga kirish</p>
        </div>

        <!-- Xabarlar chiqish qismi -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %} alert-dismissible fade show p-2 small mb-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Username yoki Telefon raqam</label>
                <input type="text" 
                       name="username" 
                       class="form-control"
                       placeholder="Username yoki +998901234567" 
                       required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small text-secondary fw-semibold mb-0">Parol</label>
                    <a href="{% url 'password_reset' %}" class="small text-decoration-none text-muted">Parolni unutdingizmi?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                Kirish
            </button>
        </form>

        <div class="text-center pt-3 border-top small">
            <span class="text-muted">Akkuntingiz yo'qmi?</span> 
            <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-primary ms-1">Ro'yxatdan o'tish</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
