<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MebelDesign - Parolni tiklash</title>
</head>
<body>

    <h1>MebelDesign</h1>
    <h2>Parolni tiklash</h2>

    <!-- Xatolik yoki xabarlarni chiqarish uchun qism -->
    {% if messages %}
        <div style="margin-bottom: 15px;">
            {% for message in messages %}
                <p style="color: {% if message.tags == 'success' %}green{% else %}red{% endif %}; background-color: {% if message.tags == 'success' %}#e6ffed{% else %}#ffe6e6{% endif %}; padding: 10px; border-radius: 4px; margin: 5px 0;">
                    {{ message }}
                </p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <label>Telefon raqamingizni kiriting</label><br>
        <!-- Telefon raqam uchun 13 ta belgi cheklovi, format va xavfsizlik qo'shildi -->
        <input type="tel" 
               name="phone" 
               value="+998" 
               placeholder="+998901234567" 
               maxlength="13" 
               pattern="\+998[0-9]{9}" 
               title="Iltimos, formatni to'g'ri kiriting: +998901234567 (jami 13 ta belgi)" 
               oninput="this.value = this.value.replace(/[^0-9+]/g, '')" 
               required><br><br>

        <button type="submit">Tasdiqlash</button>
    </form>

    <p style="margin-top: 15px;">
        <a href="{% url 'login' %}">   Orqaga </a>
    </p>

</body>
</html>
