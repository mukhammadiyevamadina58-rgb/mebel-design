{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "MebelDesign - Parolni tiklash" %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #f4f6f9;
        }
        .auth-card {
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card auth-card border-0 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="bi bi-box-seam me-2"></i>MebelDesign</h2>
            <p class="text-muted small mb-0">{% trans "Parolni tiklash" %}</p>
        </div>

        <!-- Xabarlar chiqish qismi -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'success' %}success{% else %}danger{% endif %} alert-dismissible fade show p-2 small mb-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">{% trans "Telefon raqamingizni kiriting" %}</label>
                <input type="text" 
                       name="phone" 
                       class="form-control"
                       placeholder="+998901234567" 
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                {% trans "Tasdiqlash" %}
            </button>
        </form>

        <div class="text-center pt-3 border-top small">
            <a href="{% url 'login' %}" class="text-decoration-none fw-semibold text-secondary">
                <i class="bi bi-arrow-left me-1"></i> {% trans "Orqaga" %}
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
