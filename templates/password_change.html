{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Parolni o'zgartirish" %}{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-white text-dark border-0 shadow-lg rounded-4 p-4 w-100" style="max-width: 450px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3 mb-2" style="background-color: #e6f4f1; width: 70px; height: 70px;">
                <i class="bi bi-key-fill fs-2" style="color: #0d9488;"></i>
            </div>
            <h4 class="fw-bold mt-2" style="color: #0f766e;">{% trans "Parolni o'zgartirish" %}</h4>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control bg-light text-dark border-0 py-2 shadow-sm rounded-3" required>
                    {% if field.errors %}
                        <div class="text-danger small mt-1 fw-medium">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn text-white rounded-pill py-2 w-100 fw-bold mt-3 shadow-sm" style="background-color: #0d9488;">{% trans "Parolni yangilash" %}</button>
        </form>
    </div>
</div>
{% endblock %}
